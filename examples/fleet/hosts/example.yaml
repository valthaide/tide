# yaml-language-server: $schema=https://github.com/valthaide/tide/releases/download/v2.4.0/host.schema.json
$schema: https://github.com/valthaide/tide/releases/download/v2.4.0/host.schema.json
schema: 1
host: example.internal
tenants:
  acme:
    failure_policy: hold
    cpu_limit: "2"
    memory_limit: 4g
apps:
  - name: web
    tenant: acme
    repo_url: https://git.example/org/web.git
    branch: main
    template: web
    app_dir: backend
    depends_on: [api]
    cpu_limit: "0.5"
    memory_limit: 512m
  - name: api
    tenant: acme
    repo_url: https://git.example/org/api.git
    branch: main
    compose_path: docker-compose.yml
    critical: true
    cpu_limit: "1"
    memory_limit: 1g
