name: tide

services:
  tide:
    build:
      context: .
      dockerfile: Dockerfile.controller
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8081:8081"
    environment:
      - LOG_LEVEL=debug
      - DB_TYPE=postgres
      - DB_CONNECTION_STRING=postgres://tide:secret@postgres:5432/tide?sslmode=disable
      - TIDE_RECONCILE_INTERVAL=10s
      - TIDE_SYNC_TIMEOUT=5m
      - TIDE_RUNTIME_DIR=${TIDE_RUNTIME_DIR:-/tmp/tide-runtime}
    volumes:
      - ${TIDE_RUNTIME_DIR:-/tmp/tide-runtime}:${TIDE_RUNTIME_DIR:-/tmp/tide-runtime}
      - tide_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=tide
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=tide
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tide -d tide"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  tide_data:
  postgres_data:
