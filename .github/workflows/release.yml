name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go vet ./...
      - run: go test -race ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      # Generate the fleet host schema BEFORE publishing so GoReleaser can
      # attach it with the binaries in one atomic release. A missing or
      # empty schema file fails the job before any GitHub Release is created.
      - name: Generate host schema
        run: |
          set -euo pipefail
          go run ./cmd/tide schema host --version "${GITHUB_REF_NAME}" > host.schema.json
          test -s host.schema.json
          grep -F "\"\$id\": \"https://github.com/valthaide/tide/releases/download/${GITHUB_REF_NAME}/host.schema.json\"" host.schema.json
          # Refuse to publish if the generated schema drifted from the
          # committed copy (aside from this release's $id / tide_version).
          python3 - <<'PY'
          import json, sys
          a = json.load(open("host.schema.json"))
          b = json.load(open("schemas/host.schema.json"))
          for doc in (a, b):
              doc.pop("$id", None)
              xt = doc.get("x-tide") or {}
              xt.pop("tide_version", None)
              doc["x-tide"] = xt
          if a != b:
              print("generated schema shape differs from committed schemas/host.schema.json", file=sys.stderr)
              sys.exit(1)
          print("schema shape matches committed copy")
          PY

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --release-notes CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Refuse a half-published release: binaries and host.schema.json must
      # all be present as assets. Existing tags are never overwritten.
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)"
          echo "Release assets:"
          echo "$assets"
          echo "$assets" | grep -qx 'host.schema.json' || { echo "missing asset: host.schema.json" >&2; exit 1; }
          echo "$assets" | grep -E '^tidectl_' >/dev/null || { echo "missing tidectl binary archives" >&2; exit 1; }
          echo "$assets" | grep -E '^tide_' >/dev/null || { echo "missing tide binary archives" >&2; exit 1; }
          echo "$assets" | grep -qx 'checksums.txt' || { echo "missing asset: checksums.txt" >&2; exit 1; }
          echo "All required release assets present."

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.controller
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
