name: mirror to gitlab

on:
  push:
  workflow_dispatch:

# Branch and tag pushes must not update GitLab at the same time.
concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: push to gitlab
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          # Full clone URL without credentials, e.g. https://gitlab.example/group/conops.git
          GITLAB_MIRROR_URL: ${{ secrets.GITLAB_MIRROR_URL }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_MIRROR_TOKEN:-}" ] || [ -z "${GITLAB_MIRROR_URL:-}" ]; then
            echo "GITLAB_MIRROR_TOKEN and GITLAB_MIRROR_URL secrets are required" >&2
            exit 1
          fi
          mirror_url=$(printf '%s\n' "$GITLAB_MIRROR_URL" | sed "s#https://#https://oauth2:${GITLAB_MIRROR_TOKEN}@#")
          git remote add gitlab "$mirror_url"
          if [ "$REF_TYPE" = "tag" ]; then
            # Never rewrite an existing tag and never move main.
            git push gitlab "refs/tags/${REF_NAME}:refs/tags/${REF_NAME}"
            exit 0
          fi
          if [ "$REF_NAME" != "master" ] && [ "$REF_NAME" != "main" ]; then
            echo "skip mirror of branch ${REF_NAME}"
            exit 0
          fi
          # GitLab main follows this push. Histories diverged after the old
          # GitLab-only CI pin, so a fast-forward is rejected. Tags are not moved.
          git push --force gitlab "HEAD:refs/heads/main"
