stages:
  - build

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_TAG'

default:
  tags:
    - platform

variables:
  DOCKERFILE: Dockerfile.controller

build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"${CI_REGISTRY}":{"username":"${CI_REGISTRY_USER}","password":"${CI_REGISTRY_PASSWORD}"}}}
      EOF
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION="${CI_COMMIT_TAG}"
        DEST="${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      else
        VERSION="${CI_COMMIT_SHORT_SHA:-dev}"
        DEST="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      fi
      echo "Building ${DEST} version ${VERSION}"
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/${DOCKERFILE}" \
        --destination "${DEST}" \
        --build-arg "VERSION=${VERSION}" \
        --snapshot-mode=redo \
        --use-new-run
      echo "Built version ${VERSION}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never

pull-github:
  stage: build
  image:
    name: alpine/git:2.54.0@sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  resource_group: github-pull
  script:
    - |
      set -eu
      umask 077
      export HOME="$(mktemp -d)"
      export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
      gh="https://github.com/valthaide/tide.git"
      gl="https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      auth="Authorization: Basic $(printf 'gitlab-ci-token:%s' "$CI_JOB_TOKEN" | base64 | tr -d '\n')"
      git init -q "$HOME/work"
      cd "$HOME/work"
      git fetch -q "$gh" main:refs/heads/gh
      git -c "http.extraheader=$auth" fetch -q "$gl" main:refs/heads/gl
      if [ "$(git rev-parse gh)" = "$(git rev-parse gl)" ]; then
        echo "main is up to date at $(git rev-parse --short gl)"
      else
        if ! git merge-base --is-ancestor gl gh; then
          echo "GitHub main is not a fast forward of GitLab main, refusing to update" >&2
          exit 1
        fi
        git -c "http.extraheader=$auth" push -q "$gl" gh:refs/heads/main
        echo "main updated to $(git rev-parse --short gh)"
      fi
      git ls-remote --tags "$gh" > gh_refs
      git -c "http.extraheader=$auth" ls-remote --tags "$gl" > gl_refs
      awk '$2 !~ /\^\{\}$/ { sub("refs/tags/", "", $2); print $2 }' gh_refs | sort > gh_tags
      awk '$2 !~ /\^\{\}$/ { sub("refs/tags/", "", $2); print $2 }' gl_refs | sort > gl_tags
      comm -23 gh_tags gl_tags > new_tags
      while read -r tag; do
        case "$tag" in
          *[!A-Za-z0-9._-]*) echo "skipping tag with unexpected name" >&2; continue ;;
        esac
        git fetch -q "$gh" "refs/tags/$tag:refs/tags/$tag"
        git -c "http.extraheader=$auth" push -q "$gl" "refs/tags/$tag:refs/tags/$tag"
        echo "tag $tag added"
      done < new_tags
      echo "tags checked, $(wc -l < new_tags) new"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
